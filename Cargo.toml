[package]
name = "rustify"
version = "1.4.0"
edition = "2021"
description = "Rustify — Minimalist Liquid Glass Music Player with BPM DJ Mixing"

[[bin]]
name = "Rustify"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.31"
egui_glow = "0.31"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "pcm"] }
rustfft = "6.2"
souvlaki = "0.8"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
raw-window-handle = "0.6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
beat-this = { version = "1.1", default-features = false }
discord-rich-presence = "1.1"
sha2 = "0.10"

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
