name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach assets to"
        required: false
        default: "v1.4.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mint:
    name: Build & Test Mint (.deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            xvfb \
            libgl1-mesa-dri \
            libegl1-mesa \
            libgles2-mesa \
            mesa-utils \
            desktop-file-utils \
            yt-dlp \
            ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy & tests
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --no-fail-fast

      - name: Build release
        run: cargo build --release --locked

      - name: Verify ldd & headless GUI smoke test
        run: |
          ldd target/release/Rustify
          if ldd target/release/Rustify | grep -q "not found"; then exit 1; fi
          rm -f /tmp/smoke_mint.png
          RUSTIFY_CAPTURE_VIEW=setup \
          RUSTIFY_CAPTURE_PNG=/tmp/smoke_mint.png \
          LIBGL_ALWAYS_SOFTWARE=1 \
          xvfb-run -a -s "-screen 0 1280x800x24" \
            timeout 30s ./target/release/Rustify
          test -f /tmp/smoke_mint.png
          test "$(stat -c%s /tmp/smoke_mint.png)" -gt 10240

      - name: Build & install-test .deb (Linux Mint)
        run: |
          bash linux/build-deb-ci.sh 1.4.0
          sudo apt-get install -y ./dist/rustify-private_1.4.0_amd64.deb
          which rustify
          desktop-file-validate /usr/share/applications/rustify.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/rustify.png

      - uses: actions/upload-artifact@v4
        with:
          name: mint-deb
          path: dist/*.deb
          if-no-files-found: error

  build-arch:
    name: Build & Test Arch (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            rust \
            alsa-lib \
            gtk3 \
            dbus \
            libxkbcommon \
            libxkbcommon-x11 \
            libglvnd \
            curl \
            hicolor-icon-theme \
            pipewire-pulse \
            yt-dlp \
            ffmpeg \
            xorg-server-xvfb \
            mesa \
            desktop-file-utils \
            sudo \
            git

      - name: Setup builder user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Clippy & tests on Arch
        run: |
          su - builder -c "cd '${GITHUB_WORKSPACE}' && cargo clippy --all-targets -- -D warnings && cargo test --no-fail-fast"

      - name: Build Arch package (.pkg.tar.zst)
        run: |
          su - builder -c "cd '${GITHUB_WORKSPACE}/linux' && makepkg -f --noconfirm"
          mkdir -p dist
          cp linux/rustify-*-x86_64.pkg.tar.zst dist/

      - name: Install-test & GUI smoke test on Arch
        run: |
          pacman -U --noconfirm dist/rustify-*-x86_64.pkg.tar.zst
          which rustify
          ldd /usr/bin/rustify
          if ldd /usr/bin/rustify | grep -q "not found"; then exit 1; fi
          desktop-file-validate /usr/share/applications/rustify.desktop
          rm -f /tmp/smoke_arch.png
          su - builder -c "RUSTIFY_CAPTURE_VIEW=setup RUSTIFY_CAPTURE_PNG=/tmp/smoke_arch.png LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x800x24' timeout 30s /usr/bin/rustify"
          test -f /tmp/smoke_arch.png
          test "$(stat -c%s /tmp/smoke_arch.png)" -gt 10240

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish Assets
    needs: [build-mint, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || 'v1.4.0' }}
        run: |
          ls -lh release-assets/
          gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
